services:
  db:
    image: postgres:16
    container_name: odoo19_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - odoo19-db-data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [odoo-net]

  odoo:
    build: .
    image: odoo19-sunat:latest
    container_name: odoo19_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ODOO_PORT:-8069}:8069"
      - "${ODOO_GEVENT_PORT:-8072}:8072"
    environment:
      HOST: db
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Lima
    volumes:
      - odoo19-web-data:/var/lib/odoo
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./addons:/mnt/extra-addons
      - ./scripts:/mnt/scripts:ro
      - ./certs:/mnt/certs:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8069/web/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [odoo-net]

  # Proxy inverso opcional:  docker compose --profile proxy up -d
  nginx:
    image: nginx:1.27-alpine
    container_name: odoo19_nginx
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on: [odoo]
    ports:
      - "80:80"
    volumes:
      - ./nginx/odoo.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [odoo-net]

networks:
  odoo-net:

volumes:
  odoo19-db-data:
  odoo19-web-data:
