[options]
; Clave maestra para crear/borrar/respaldar bases desde la web. CÁMBIALA.
admin_passwd = master_pass_cambiar

addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

; Credenciales de PostgreSQL: NO se definen aquí. Vienen de .env
; (POSTGRES_USER / POSTGRES_PASSWORD) mediante docker-compose.yml.

; Desarrollo: workers = 0. Producción / Nginx (websocket en 8072): workers >= 2
workers = 0
gevent_port = 8072
limit_time_cpu = 120
limit_time_real = 240
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560

; Actívalo (True) si usas el perfil nginx u otro proxy con HTTPS
proxy_mode = False
log_level = info
